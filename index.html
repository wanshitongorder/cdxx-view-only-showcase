<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071109">
  <meta name="description" content="A view-only tour of the CDXX Order of Wan Shi Tong alliance archive.">
  <title>CDXX · Order of Wan Shi Tong Showcase</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#home" data-route="home" aria-label="Order of Wan Shi Tong home">
        <img src="assets/wordmark.png" alt="Order of Wan Shi Tong">
      </a>
      <div class="edition"><span>CDXX SHOWCASE</span><b>View-only archive</b></div>
      <nav id="navigation" aria-label="Showcase navigation"></nav>
      <div class="sidebar-foot">
        <span class="live-dot"></span>
        <div><b>Demonstration mode</b><small>Representative data · no live connection</small></div>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <button class="menu-button" id="menu-button" aria-label="Open navigation" aria-expanded="false">☰</button>
        <div>
          <p class="eyebrow" id="page-eyebrow">THE ENCOUNTER</p>
          <h1 id="page-title">Welcome to the living record.</h1>
        </div>
        <div class="top-actions">
          <span class="readonly">◆ VIEW ONLY</span>
          <button id="tour-button" class="ghost">START GUIDED TOUR</button>
        </div>
      </header>
      <section id="app" tabindex="-1"></section>
    </main>
  </div>

  <dialog id="tour-dialog">
    <button class="dialog-close" aria-label="Close tour">×</button>
    <p class="eyebrow" id="tour-step">TOUR · 1 OF 6</p>
    <h2 id="tour-title">One alliance, remembered.</h2>
    <p id="tour-copy"></p>
    <div class="tour-progress"><i id="tour-progress"></i></div>
    <div class="dialog-actions"><button class="ghost" id="tour-skip">END TOUR</button><button class="primary" id="tour-next">NEXT CHAPTER →</button></div>
  </dialog>

  <template id="chart-template">
    <svg class="line-chart" viewBox="0 0 720 250" role="img">
      <g class="grid"><line x1="52" y1="36" x2="700" y2="36"/><line x1="52" y1="96" x2="700" y2="96"/><line x1="52" y1="156" x2="700" y2="156"/><line x1="52" y1="216" x2="700" y2="216"/></g>
      <path class="chart-area" d="M52 205 C140 190,170 178,244 169 S370 135,420 125 S550 85,700 52 L700 216 L52 216Z"/>
      <path class="chart-line" d="M52 205 C140 190,170 178,244 169 S370 135,420 125 S550 85,700 52"/>
      <g class="points"><circle cx="52" cy="205" r="6"/><circle cx="244" cy="169" r="6"/><circle cx="420" cy="125" r="6"/><circle cx="568" cy="88" r="6"/><circle cx="700" cy="52" r="7"/></g>
      <g class="labels"><text x="52" y="240">W39</text><text x="236" y="240">W40</text><text x="412" y="240">W41</text><text x="560" y="240">W42</text><text x="684" y="240">W43</text></g>
    </svg>
  </template>
  <script src="app.js"></script>
</body>
</html>
